# يشغّل المجموعات الثلاث لـ crypto_trading_v11: المحرك (unittest)،
# لوحة المتابعة (unittest + Flask)، وواجهة اللوحة (node، بلا اعتماديات).
#
# crypto_trading_v9 نسخة سابقة محفوظة للرجوع، ولا تُفحص آلياً بطلب
# صريح. لإعادة إدراجها: أضِف `strategy.matrix.project` بالمشروعين
# واستبدل `crypto_trading_v11` الحرفية أدناه بـ `${{ matrix.project }}`
# (في name و working-directory و cache-dependency-path).
name: tests

on:
  # push مقصور على main عمداً: تركه على كل الفروع كان يُشغّل نفس
  # الكود مرّتين (مرّة لـ push ومرّة لـ pull_request)، و`concurrency`
  # لا يمنع ذلك لأن github.ref يختلف بين المُحفِّزين
  # (refs/heads/… مقابل refs/pull/N/merge) فيقعان في مجموعتين.
  # الآن: الـ PR تشغيل واحد، و main تشغيل واحد بعد الدمج.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: crypto_trading_v11
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: crypto_trading_v11

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            crypto_trading_v11/requirements.txt
            crypto_trading_v11/dashboard/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: تثبيت الاعتماديات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dashboard/requirements.txt

      # حارس انحدار: قاعدة `data/` غير المثبَّتة بالجذر في .gitignore
      # كانت تستبعد حزمة المصدر src/data/ بالكامل — المستودع كان يصل
      # ناقصاً ولا يعمل. الفحص يمنع تكرار ذلك على أي ملف مصدر.
      - name: لا ملف مصدر مستبعَد بـ .gitignore
        run: |
          missing=$(comm -13 \
            <(git ls-files src | grep '\.py$' | sort) \
            <(find src -name '*.py' | sort))
          if [ -n "$missing" ]; then
            echo "⛔ ملفات مصدر غير متتبَّعة (مستبعَدة بـ .gitignore؟):"
            echo "$missing"
            exit 1
          fi
          echo "✅ كل ملفات src/ متتبَّعة"

      - name: فحص الترجمة
        run: python -m compileall -q src tests dashboard/backend live_trader.py watchdog.py

      - name: اختبارات المحرك
        run: python -m unittest discover -s tests

      - name: اختبارات اللوحة
        run: python -m unittest discover -s dashboard/tests -t .

      - name: اختبارات الواجهة
        run: node dashboard/tests/test_frontend.mjs
