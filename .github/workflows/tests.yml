# يشغّل المجموعات الثلاث لكل مشروع: المحرك (unittest)، لوحة المتابعة
# (unittest + Flask)، وواجهة اللوحة (node، بلا اعتماديات خارجية).
name: tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [crypto_trading_v9, crypto_trading_v11]

    defaults:
      run:
        working-directory: ${{ matrix.project }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            ${{ matrix.project }}/requirements.txt
            ${{ matrix.project }}/dashboard/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: تثبيت الاعتماديات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dashboard/requirements.txt

      # حارس انحدار: قاعدة `data/` غير المثبَّتة بالجذر في .gitignore
      # كانت تستبعد حزمة المصدر src/data/ بالكامل — المستودع كان يصل
      # ناقصاً ولا يعمل. الفحص يمنع تكرار ذلك على أي ملف مصدر.
      - name: لا ملف مصدر مستبعَد بـ .gitignore
        run: |
          missing=$(comm -13 \
            <(git ls-files src | grep '\.py$' | sort) \
            <(find src -name '*.py' | sort))
          if [ -n "$missing" ]; then
            echo "⛔ ملفات مصدر غير متتبَّعة (مستبعَدة بـ .gitignore؟):"
            echo "$missing"
            exit 1
          fi
          echo "✅ كل ملفات src/ متتبَّعة"

      - name: فحص الترجمة
        run: python -m compileall -q src tests dashboard/backend live_trader.py watchdog.py

      - name: اختبارات المحرك
        run: python -m unittest discover -s tests

      - name: اختبارات اللوحة
        run: python -m unittest discover -s dashboard/tests -t .

      - name: اختبارات الواجهة
        run: node dashboard/tests/test_frontend.mjs
